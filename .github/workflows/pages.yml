name: Pages

# дашборд собирается из тех же исходников, что и библиотека: алиас ведёт в src;
# примеры ложатся рядом, в подпапки
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# висящий деплой отменяем: выкладывать надо последнее состояние main
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # пример ставит библиотеку из npm, как её получит читатель
      - run: npm run examples:install
      - run: npm run playground:check
      - run: npm run playground:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
