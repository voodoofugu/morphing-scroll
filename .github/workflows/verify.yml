name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # webkit — ради проверки выделения: там оно гасится иначе, чем в chromium
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run release:check
